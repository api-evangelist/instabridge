aid: instabridge
name: instabridge
description: Instabridge is a global internet connectivity company operated by Degoo
  Backup AB in Stockholm, Sweden, and backed by Balderton Capital and Creandum. Its
  mobile apps give users access to a crowdsourced map of roughly 20 million free WiFi
  hotspots and to prepaid eSIM mobile-data plans covering 190+ countries with no roaming
  fees. With more than 200 million app downloads, Instabridge combines community-shared
  WiFi, pay-as-you-go global data, a data-saving browser, VPN, and cloud storage,
  and runs a distribution-partner program for prepaid top-up resellers. It is a consumer
  app company with no public developer API surface at this time.
